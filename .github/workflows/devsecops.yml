name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest

    steps:
      # ── Layer 1: Environment Setup ──────────────────────────────────────────

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Create Results Directory
        run: mkdir -p results

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Python Dependency Evidence
        run: |
          pip freeze > requirements-lock.txt
          cp requirements.txt results/requirements.txt
          cp requirements-lock.txt results/requirements-lock.txt

      # ── Layer 2: Security Scanning ───────────────────────────────────────────

      - name: SonarCloud Scan (SAST)
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: OWASP Dependency Check (SCA)
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: 'devsecops-thesis'
          path: '.'
          format: 'HTML'
          out: 'results'
          args: >
            --enableRetired
            --enableExperimental

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: results/

      # ── Layer 3: Containerization ─────────────────────────────────────────────

      - name: Build Docker Image
        run: docker build -t devsecops-demo:latest .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-demo:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'
          output: 'results/trivy-results.txt'

      # ── Layer 4: Artifact Collection ──────────────────────────────────────────

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: results/trivy-results.txt

      - name: Upload Pipeline Logs Summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-logs
          path: results/
